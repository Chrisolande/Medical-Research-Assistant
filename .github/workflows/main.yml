name: Tests

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Cache dependencies and models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/flashrank
            ~/.cache/huggingface
            .venv
          key: ${{ runner.os }}-py3.11-${{ hashFiles('pyproject.toml', 'uv.lock') }}-v1
          restore-keys: |
            ${{ runner.os }}-py3.11-

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Pre-download FlashRank model
        run: |
          uv run python -c "
          from medical_graph_rag.config import FLASHRANK_MODEL_NAME, FLASHRANK_CACHE_DIR
          from flashrank import Ranker, RerankRequest
          ranker = Ranker(model_name=FLASHRANK_MODEL_NAME, cache_dir=FLASHRANK_CACHE_DIR)
          result = ranker.rerank(RerankRequest(query='test', passages=[{'text': 'test'}]))
          print('FlashRank model ready')
          "

      - name: Run tests
        run: uv run pytest --tb=short --no-cov

      - name: Run tests with coverage
        run: uv run pytest --cov=medical_graph_rag --cov-report=xml --cov-report=term-missing
