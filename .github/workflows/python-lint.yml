name: Python Linting

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-py3.11-lint-${{ hashFiles('pyproject.toml', 'uv.lock') }}-v2
          restore-keys: |
            ${{ runner.os }}-py3.11-lint-

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Fix with pyupgrade
        run: |
          find . -name "*.py" \
            -not -path "./.venv/*" \
            -not -path "./venv/*" \
            -not -path "./.git/*" \
            -exec uv run pyupgrade --py311-plus {} +
        continue-on-error: true

      - name: Fix with autoflake
        run: |
          uv run autoflake \
            --remove-all-unused-imports \
            --remove-unused-variables \
            --remove-duplicate-keys \
            --in-place \
            --recursive \
            --exclude=.venv,venv,env,.git,__pycache__ \
            .
        continue-on-error: true

      - name: Fix with ruff
        run: |
          uv run ruff check . --fix --exit-zero
          uv run ruff format .

      - name: Commit fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix linting issues"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Run bandit
        run: |
          uv run bandit \
            -r . \
            -f json \
            -o bandit-report.json \
            -c pyproject.toml \
            -ll \
            --skip=B101,B403,B601 \
            --exclude .venv,venv,env,.git,__pycache__ \
          || true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report-${{ github.run_id }}
          path: bandit-report.json
          if-no-files-found: warn

      - name: Check complexity
        run: |
          output=$(uv run radon cc app.py medical_graph_rag/ -s --min C 2>/dev/null || true)
          if [ -n "$output" ]; then
            echo "Functions exceeding grade B:"
            echo "$output"
            exit 1
          fi
          echo "All functions meet grade B or above"